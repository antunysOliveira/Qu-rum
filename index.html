<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presença de Raid</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="css">
/* VOICE: oficial de raid fazendo a chamada — direto, rápido de marcar

   PICTURE: a grade de bolinhas por jogador, pintada com a cor da classe
   COLOUR and TYPE: faixa carmesim de estandarte, fundo branco/noite, cores de classe; Chakra Petch + Inter
   LAYOUT: estandarte com ações, números-chave, chamada à esquerda, análise ao lado */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121015);--ink:light-dark(#17131a,#efe9f1);--mut:light-dark(#655e6b,#a79eac);--pan:light-dark(#f4f2f5,#1c1921);--line:light-dark(#e5e1e8,#2d2833);--band:light-dark(#b01d33,#7a1325);--pri:light-dark(#b01d33,#d6334b);--low:light-dark(#cf1f2d,#ff6170);--lowbg:light-dark(#fdebed,#2e1418);--ok:light-dark(#18804f,#4bcf8d);--pip:light-dark(#e3dfe7,#332d3a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.band{padding:clamp(24px,3.4vw,44px) max(4vw,16px)}
.hero{background:var(--band);color:#fff}
.hwrap{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end;justify-content:space-between}
.ttl{flex:1 1 380px}
.gname{font:700 clamp(30px,4.4vw,50px)/1.05 'Chakra Petch',sans-serif;background:none;border:0;border-bottom:2px dashed transparent;color:#fff;width:100%;padding:0 0 2px}
.gname:hover,.gname:focus{border-bottom-color:rgba(255,255,255,.55);outline:none}
.sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.meta{margin:10px 0 0;opacity:.85;font-size:15px}
.hbtn,.wsel{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:15px}
.wsel{font-size:16px;max-width:240px}.wsel option{color:#17131a;background:#fff}
.hbtn:hover:not(:disabled){background:rgba(255,255,255,.2)}
.hbtn.pri{background:#fff;color:#8f1528;border-color:#fff}
.hero :focus-visible{outline-color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.st{flex-basis:100%;text-align:right;margin:0;font-size:14px;opacity:.9}
main{max-width:1240px;margin:0 auto;padding:22px max(4vw,16px) 64px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--line)}
.kpi{padding:14px 16px;border:0;border-left:1px solid var(--line);background:none;text-align:left;display:grid;gap:2px}
.kpi:first-child{border-left:0;padding-left:0}
button.kpi:hover{background:var(--pan)}
.kpi b{font:700 clamp(28px,3.4vw,40px)/1 'Chakra Petch',sans-serif;font-variant-numeric:tabular-nums}
.kpi span{font-weight:600}.kpi small{color:var(--mut);font-size:13px}
.kpi.w b{color:var(--low)}.kpi.g b{color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px 0 6px;background:var(--bg);z-index:5}
@media(min-width:900px){.tools{position:sticky;top:0}}
.in{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
#q{flex:1 1 170px}#fc{max-width:200px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;opacity:.6;margin-left:4px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--pan);color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--mut)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.dng{color:var(--low);background:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.hint{color:var(--mut);font-size:14px;margin:4px 0 12px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start;margin-top:10px}
@media(max-width:1020px){.layout{grid-template-columns:minmax(0,1fr)}}
.grp{margin-bottom:26px}
.grp>header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;border-bottom:2px solid var(--c,var(--ink))}
.grp h3{font:700 21px/1.1 'Chakra Petch',sans-serif;margin:0}
.gm{color:var(--mut);font-size:14px;margin-right:auto}
.sw{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none;display:inline-block}
.cic{width:24px;height:24px;object-fit:contain;flex:none;display:inline-block;vertical-align:middle;border-radius:4px}
.grp>header .cic{width:30px;height:30px}
.flat .cl .cic{width:14px;height:14px;border-radius:3px}
.bar .cic{width:16px;height:16px;margin-right:6px;vertical-align:text-bottom;border-radius:3px}
.pl .cic{width:16px;height:16px;border-radius:3px}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) 92px 40px;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.row.warn{border-left-color:var(--low);background:linear-gradient(90deg,var(--lowbg),transparent 55%)}
.who{display:grid}
.nm{font-weight:600;font-size:16px;border:1px solid transparent;background:none;padding:6px 8px;border-radius:8px;width:100%}
.nm:hover{border-color:var(--line)}.nm:focus{border-color:var(--pri);outline:none;background:var(--bg)}
.cl{display:none;font-size:13px;color:var(--mut);padding-left:9px}
.flat .cl{display:flex;gap:6px;align-items:center}.flat .cl .sw{width:9px;height:9px}
.days{display:grid;grid-template-columns:repeat(3,auto);gap:12px 18px;justify-content:start}
.day{display:grid;gap:5px}
.dn{background:none;border:0;padding:0;font-size:12px;font-weight:600;color:var(--mut);text-align:left}
.dn b{color:var(--ink)}.dn:hover b{text-decoration:underline}
.pips{display:flex;gap:3px}
.pip{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--pip);background:transparent;padding:0;transition:background .15s,transform .15s}
.pip.on{background:var(--c);border-color:var(--c)}
.pip:hover{transform:translateY(-2px)}
.day.zero .pip{border-style:dashed}
@media(pointer:coarse){.pip{width:28px;height:28px}}
.lw{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}
.lw button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--mut);padding:0;line-height:1;font-size:15px}
.lw.has span{color:var(--low);font-weight:700}
.sum{display:grid;gap:3px;justify-items:end;text-align:right}
.sum b{font:700 23px/1 'Chakra Petch',sans-serif;font-variant-numeric:tabular-nums}
.sum b.full{color:var(--ok)}.sum b.bad{color:var(--low)}
.sum small{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.meter{width:100%;height:6px;background:var(--pip);border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;background:var(--c)}
.badge{font-weight:700;font-size:12px;color:#fff;background:var(--low);padding:2px 8px;border-radius:999px;white-space:nowrap}
.more{width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:none;color:var(--mut);font-size:20px;line-height:1}
.more:hover{border-color:var(--line);color:var(--ink)}

.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line);border-radius:14px}

aside{display:grid;gap:4px}

.bar{display:grid;grid-template-columns:minmax(0,118px) minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.bar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{height:10px;background:var(--pip);border-radius:5px;overflow:hidden}.tr i{display:block;height:100%;background:var(--c,var(--pri))}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pl{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;min-height:40px;border:0;background:none;padding:4px 6px;border-radius:8px;text-align:left;font-size:14px}

.pl b{color:var(--low);font-variant-numeric:tabular-nums}.pl b.m{color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(12,6,14,.55);display:grid;place-items:center;padding:16px;z-index:50}
.ov[hidden]{display:none}
.dlg{background:var(--bg);color:var(--ink);border-radius:16px;max-width:580px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.4)}

.dlg h3{font:700 18px 'Chakra Petch',sans-serif;margin:18px 0 4px}
.fld{display:grid;gap:6px;margin-bottom:12px;font-size:14px;font-weight:600}
textarea.in{padding:10px 12px;min-height:200px;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical;width:100%}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:15px}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--pri);flex:none}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;margin-bottom:8px}
.dact{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}
.dact .sp{flex:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.25s;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;font-weight:600;max-width:min(92vw,520px);text-align:center}

function rowHTML(p,w){
 const c=ccol(p.cls),P=pres(p),T=tot(w),L=lows(p),pc=T?Math.round(P/T*100):0;
 const days=w.days.map((d,di)=>{
  const a=p.a[di]||0,l=p.l[di]||0;let pips='';
  for(let i=0;i<d.m;i++)pips+=`<button class="pip${i<a?' on':''}" data-a="pip" data-d="${di}" data-i="${i}" aria-label="${esc(d.n)}, raid ${i+1}" aria-pressed="${i<a}"></button>`;
  return `<div class="day${a===0?' zero':''}"><button class="dn" data-a="dayall" data-d="${di}" title="Marcar ou limpar todas de ${esc(d.n)}">${esc(d.n)} <b>${a}/${d.m}</b></button><div class="pips">${pips}</div><div class="lw${l?' has':''}"><button data-a="lowm" data-d="${di}" aria-label="Menos um baixo em ${esc(d.n)}">−</button><span>baixo ${l}</span><button data-a="lowp" data-d="${di}" aria-label="Mais um baixo em ${esc(d.n)}">+</button></div></div>`}).join('');
 return `<div class="row${L?' warn':''}" data-id="${esc(p.id)}" style="--c:${c}"><div class="who"><input class="nm" value="${esc(p.name)}" aria-label="Nome do jogador" maxlength="40"><span class="cl">${cicon(p.cls)}${esc(p.cls)}</span></div><div class="days">${days}</div><div class="sum"><b class="${pc===100?'full':pc<50?'bad':''}">${pc}%</b><small>${P}/${T} raids</small><span class="meter"><i style="width:${pc}%"></i></span>${L?`<span class="badge">Baixo ${L}×</span>`:''}</div><button class="more" data-a="edit" aria-label="Editar ${esc(p.name)}">⋯</button></div>`;
}
function shown(w){

}

const bar=(label,pc,val,col,ic)=>`<div class="bar" style="--c:${col||'var(--pri)'}"><span title="${esc(label)}">${ic||''}${esc(label)}</span><span class="tr"><i style="width:${pc}%"></i></span><em>${val}</em></div>`;
const pl=(p,val,cls)=>`<button class="pl" data-a="find" data-v="${esc(p.name)}" style="--c:${ccol(p.cls)}">${cicon(p.cls)}<span>${esc(p.name)}<small>${esc(p.cls)}</small></span><b class="${cls||''}">${val}</b></button>`;
function renderSide(){
 const w=W(),T=tot(w),n=w.players.length;

function persist(){try{localStorage.setItem(KEY,JSON.stringify({base:BASE,state:S}))}catch(e){}}
function commit(fn){hist.push(JSON.stringify(S));if(hist.length>80)hist.shift();fut=[];fn();dirty=true;persist();render()}
function undo(){if(!hist.length)return toast('Nada para desfazer');fut.push(JSON.stringify(S));S=JSON.parse(hist.pop());dirty=true;persist();render();toast('Desfeito')}
function redo(){if(!fut.length)return;hist.push(JSON.stringify(S));S=JSON.parse(fut.pop());dirty=true;persist();render();toast('Refeito')}

function buildDoc(st){
 const json=JSON.stringify(st).replace(/</g,'\\u003c');
 return '<!DOCTYPE html>\n<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presença de Raid</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="css">'+$('#css').textContent+'</style></head><body><div id="root"></div><script type="application/json" id="state">'+json+'<\/script><script id="app">'+$('#app').textContent+'<\/script></body></html>';
}
async function save(){
 if(!ART){toast(local?'Aqui as mudanças ficam salvas neste navegador. Use Exportar para guardar um backup.':'Ainda conectando — tente de novo em instantes.');return}
 if(!dirty)return toast('Nada novo para salvar');
 const next=JSON.parse(JSON.stringify(S));next.savedAt=Date.now();next.cur=ui.wk;
 const b=$('#bSave');b.disabled=true;b.textContent='Salvando…';
 try{await ART.publish(buildDoc(next));try{localStorage.removeItem(KEY)}catch(e){}dirty=false;toast('Salvo! Recarregando com os dados novos…')}
 catch(err){const c=err&&err.code;toast(c==='conflict'?'Outra pessoa salvou antes — a página vai recarregar com a versão dela.':(c==='not_writer'||c==='not_granted')?'Você só tem acesso de leitura. Use Exportar → backup para guardar suas mudanças.':'Não consegui salvar ('+(c||'erro')+'). Suas mudanças continuam guardadas neste navegador.')}
 finally{renderStatus()}
}
async function download(name,data){
 if(!DL)return toast('Download indisponível aqui — use o botão Copiar');
 try{await DL.save({filename:name,data});toast('Arquivo pronto')}catch(e){const c=e&&e.code;if(c!=='declined')toast('Não deu para baixar ('+(c||'erro')+') — use o botão Copiar')}
}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copiado!')}catch(e){toast('Não consegui copiar — selecione o texto na caixa e copie')}}

function toText(w){return clsOrder(w).map(c=>c.toUpperCase()+'\n'+w.players.filter(p=>p.cls===c).sort(byP).map(p=>{const L=lows(p),br=w.days.map((d,i)=>p.l[i]?`${d.n} ${p.l[i]}x`:'').filter(Boolean).join(', ');return `* ${p.name}: `+w.days.map((d,i)=>`${d.n} ${p.a[i]||0}/${d.m}`).join(' | ')+' → '+(L?`⚠️ Baixo: ${L}x (${br})`:'Baixo: 0x')}).join('\n')).join('\n\n')}
function toCSV(w){
 const q=v=>{let s=String(v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const T=tot(w);
 const h=['Classe','Jogador',...w.days.flatMap(d=>[`${d.n} (de ${d.m})`,`${d.n} baixo`]),'Presenças','Total raids','Presença %','Baixos'];
 const rows=clsOrder(w).flatMap(c=>w.players.filter(p=>p.cls===c).sort(byP)).map(p=>[p.cls,p.name,...w.days.flatMap((d,i)=>[p.a[i]||0,p.l[i]||0]),pres(p),T,T?Math.round(pres(p)/T*100):0,lows(p)]);
 return '﻿'+[h,...rows].map(r=>r.map(q).join(';')).join('\r\n');
}
function parseTxt(t){
 let cls='',days=null;const players=[],classes=[];
 for(const raw of String(t).split(/\r?\n/)){
  const line=raw.trim();if(!line)continue;
  const m=line.match(/^[*\-•]\s*([^:]+):\s*(.+)$/);
  if(!m){cls=titleCase(line.replace(/[:\-–\s]+$/,''));classes.push(cls);continue}
  const name=m[1].trim(),[left,right='']=m[2].split('→');
  const ds=[...left.matchAll(/([^\s|\d][^|\d]*?)\s*(\d+)\s*\/\s*(\d+)/g)].map(x=>({n:x[1].trim(),a:+x[2],m:+x[3]}));
  if(!ds.length)continue;
  if(!days)days=ds.map(d=>({n:d.n.slice(0,12),m:Math.max(1,Math.min(20,d.m))}));
  const a=days.map(d=>{const f=ds.find(z=>norm(z.n)===norm(d.n));return f?Math.min(f.a,d.m):0}),l=days.map(()=>0);
  const par=right.match(/\(([^)]*)\)/);
  if(par)for(const x of par[1].matchAll(/([^\s,\d]+)\s*(\d+)\s*x/gi)){const i=days.findIndex(d=>norm(d.n)===norm(x[1]));if(i>=0)l[i]=Math.min(99,+x[2])}
  else{const tm=right.match(/(\d+)\s*x/i);if(tm&&+tm[1]>0)l[0]=Math.min(99,+tm[1])}
  players.push({id:uid(),name:name.slice(0,40),cls:cls||'Sem classe',a,l});
 }
 return days&&players.length?{days,players,classes}:null;
}
function clean(o){
 if(!o||!Array.isArray(o.weeks)||!o.weeks.length)throw new Error('formato');
 const num=(v,mx)=>Math.max(0,Math.min(mx,Math.round(+v||0)));
 const weeks=o.weeks.map(w=>{const days=(Array.isArray(w.days)?w.days:[]).map(d=>({n:String(d.n||'Dia').slice(0,12),m:num(d.m,20)||1}));return{id:String(w.id||uid()),label:String(w.label||'Semana').slice(0,60),days,players:(Array.isArray(w.players)?w.players:[]).map(p=>({id:String(p.id||uid()),name:String(p.name||'?').slice(0,40),cls:String(p.cls||'Sem classe').slice(0,40),a:days.map((d,i)=>num((p.a||[])[i],d.m)),l:days.map((d,i)=>num((p.l||[])[i],99))}))}}).filter(w=>w.days.length);
 if(!weeks.length)throw new Error('formato');
 return{title:String(o.title||'Presença de Raid').slice(0,80),savedAt:S.savedAt,cur:weeks.some(w=>w.id===o.cur)?String(o.cur):weeks[weeks.length-1].id,classes:Array.isArray(o.classes)?o.classes.map(String):[],weeks};
}

let lastF=null;
function openDlg(html,init){lastF=document.activeElement;const d=$('#dlg');d.innerHTML=html;$('#ov').hidden=false;init&&init(d);const f=d.querySelector('input:not([type=radio]):not([type=checkbox]):not([type=file]),textarea');(f||d.querySelector('.pri')||d).focus()}
function closeDlg(){$('#ov').hidden=true;$('#dlg').innerHTML='';if(lastF&&document.contains(lastF))lastF.focus()}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeDlg()});

function playerDlg(p,cls){
 const w=W();
 openDlg(`<h2>${p?'Editar jogador':'Novo jogador'}</h2><label class="fld">Nome<input class="in" id="pn" value="${esc(p?p.name:'')}" maxlength="40" autocomplete="off"></label><label class="fld">Classe<input class="in" id="pc" list="dcls" value="${esc(p?p.cls:(cls||''))}" maxlength="40" autocomplete="off" placeholder="Escolha ou digite uma nova"></label>${p?'':`<label class="opt"><input type="checkbox" id="pf"> Já marcar presença em todas as raids da semana</label>`}<div class="dact">${p?'<button class="btn dng" id="pdel">Remover</button><span class="sp"></span>':''}<button class="btn" data-a="close">Cancelar</button><button class="btn pri" id="pok">${p?'Salvar':'Adicionar'}</button></div>`,r=>{
  const ok=()=>{const n=$('#pn',r).value.trim(),c=$('#pc',r).value.trim();if(!n)return toast('Coloque um nome');if(!c)return toast('Escolha a classe');const cc=matchCls(c);
   commit(()=>{if(!S.classes.includes(cc))S.classes.push(cc);if(p){p.name=n;p.cls=cc}else{const f=$('#pf',r).checked;w.players.push({id:uid(),name:n,cls:cc,a:w.days.map(d=>f?d.m:0),l:w.days.map(()=>0)})}});closeDlg();toast(p?'Jogador atualizado':`${n} adicionado em ${cc}`)};
  $('#pok',r).onclick=ok;r.querySelectorAll('#pn,#pc').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')ok()}));
  if(p)$('#pdel',r).onclick=e=>{const b=e.currentTarget;if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Clique de novo para remover';return}commit(()=>{w.players=w.players.filter(x=>x.id!==p.id)});closeDlg();toast(`${p.name} removido — Ctrl+Z desfaz`)};
 });
}
function weekDlg(){
 const w=W();
 const dr=(d,i)=>`<div class="drow" data-i="${i}"><input class="in dn2" value="${esc(d.n)}" aria-label="Nome do dia" maxlength="12"><input class="in dm" type="number" min="1" max="20" value="${d.m}" aria-label="Raids no dia"><button class="btn sm drm" type="button">Remover</button></div>`;
 openDlg(`<h2>Editar semana</h2><label class="fld">Nome da semana<input class="in" id="wl" value="${esc(w.label)}" maxlength="60"></label><h3>Dias de raid</h3><p class="hint">Nome do dia e quantas raids teve. Remover um dia apaga as marcações dele.</p><div id="dl">${w.days.map(dr).join('')}</div><button class="btn" id="dadd" type="button">+ Adicionar dia</button><div class="dact"><button class="btn dng" id="wdel"${S.weeks.length<2?' disabled title="Precisa ter pelo menos uma semana"':''}>Excluir semana</button><span class="sp"></span><button class="btn" data-a="close">Cancelar</button><button class="btn pri" id="wok">Aplicar</button></div>`,r=>{
  $('#dl',r).addEventListener('click',e=>{const b=e.target.closest('.drm');if(b)b.closest('.drow').remove()});
  $('#dadd',r).onclick=()=>{const used=[...r.querySelectorAll('.dn2')].map(x=>x.value);const n=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].find(x=>!used.includes(x))||'Dia';$('#dl',r).insertAdjacentHTML('beforeend',dr({n,m:4},-1))};
  $('#wdel',r).onclick=e=>{const b=e.currentTarget;if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Clique de novo para excluir';return}commit(()=>{S.weeks=S.weeks.filter(x=>x.id!==w.id);if(S.cur===w.id)S.cur=S.weeks[S.weeks.length-1].id});closeDlg();toast('Semana excluída — Ctrl+Z desfaz')};
  $('#wok',r).onclick=()=>{const rows=[...r.querySelectorAll('.drow')];if(!rows.length)return toast('Precisa de pelo menos um dia');
   const nd=rows.map(x=>({oi:+x.dataset.i,n:$('.dn2',x).value.trim().slice(0,12)||'Dia',m:Math.max(1,Math.min(20,Math.round(+$('.dm',x).value||1)))}));
   commit(()=>{w.label=$('#wl',r).value.trim()||w.label;w.players.forEach(p=>{p.a=nd.map(d=>d.oi>=0?Math.min(p.a[d.oi]||0,d.m):0);p.l=nd.map(d=>d.oi>=0?(p.l[d.oi]||0):0)});w.days=nd.map(({n,m})=>({n,m}))});closeDlg();toast('Semana atualizada')};
 });
}
function newWeekDlg(){
 const w=W();
 openDlg(`<h2>Nova semana</h2><label class="fld">Nome<input class="in" id="nl" value="${esc(uniqLabel(monday()))}" maxlength="60"></label><label class="opt"><input type="radio" name="nm" value="copy" checked> Mesmo elenco e mesmos dias de “${esc(w.label)}”, com presença zerada</label><label class="opt"><input type="radio" name="nm" value="empty"> Semana vazia (mesmos dias, sem jogadores)</label><div class="dact"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" id="nok">Criar semana</button></div>`,r=>{
  $('#nok',r).onclick=()=>{const copyR=$('input[name=nm]:checked',r).value==='copy',id=uid();
   commit(()=>{S.weeks.push({id,label:$('#nl',r).value.trim()||monday(),days:w.days.map(d=>({...d})),players:copyR?w.players.map(p=>({id:uid(),name:p.name,cls:p.cls,a:w.days.map(()=>0),l:w.days.map(()=>0)})):[]});S.cur=id;ui.wk=id});closeDlg();toast('Semana criada')};
 });
}
function importDlg(){
 const w=W();
 openDlg(`<h2>Importar texto de presença</h2><p class="hint">Cole o relatório no mesmo formato: a CLASSE numa linha e depois “* Nome: Seg 6/6 | Ter 6/6 → Baixo: 0x”.</p><textarea class="in" id="it" aria-label="Texto de presença" placeholder="BRUXO&#10;* Solaron: Seg 6/6 | Ter 6/6 | Qua 4/4 → Baixo: 0x"></textarea><p class="hint" id="ip">Cole o texto acima.</p><label class="opt"><input type="radio" name="im" value="new" checked> Criar uma semana nova</label><label class="opt"><input type="radio" name="im" value="rep"> Substituir os dados de “${esc(w.label)}”</label><label class="fld" id="ilw">Nome da nova semana<input class="in" id="il" value="${esc(uniqLabel(monday()))}" maxlength="60"></label><div class="dact"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" id="iok" disabled>Importar</button></div>`,r=>{
  let res=null;
  $('#it',r).addEventListener('input',e=>{res=parseTxt(e.target.value);$('#iok',r).disabled=!res;$('#ip',r).textContent=res?`Reconhecidos ${res.players.length} jogadores em ${new Set(res.players.map(p=>p.cls)).size} classes · `+res.days.map(d=>`${d.n} ${d.m} raids`).join(' · '):'Ainda não reconheci nenhum jogador nesse texto.'});
  r.querySelectorAll('input[name=im]').forEach(x=>x.addEventListener('change',()=>{$('#ilw',r).hidden=$('input[name=im]:checked',r).value!=='new'}));
  $('#iok',r).onclick=()=>{if(!res)return;const rep=$('input[name=im]:checked',r).value==='rep';
   commit(()=>{res.classes.forEach(c=>{if(!S.classes.includes(c))S.classes.push(c)});if(rep){w.days=res.days;w.players=res.players}else{const id=uid();S.weeks.push({id,label:$('#il',r).value.trim()||monday(),days:res.days,players:res.players});S.cur=id;ui.wk=id}});
   closeDlg();toast(`Importados ${res.players.length} jogadores`)};
 });
}
function exportDlg(){
 const w=W(),txt=toText(w);
 openDlg(`<h2>Exportar “${esc(w.label)}”</h2><label class="fld">Texto no formato do relatório (pra colar no Discord ou WhatsApp)<textarea class="in" id="xt" readonly>${esc(txt)}</textarea></label><div class="dact" style="justify-content:flex-start;margin-top:0"><button class="btn pri" id="xc">Copiar texto</button><button class="btn" id="xcsv"${DL?'':' hidden'}>Baixar planilha (.csv)</button><button class="btn" id="xjson"${DL?'':' hidden'}>Baixar backup (.json)</button><button class="btn" id="xcj">Copiar backup</button></div><h3>Restaurar backup</h3><p class="hint">Escolha um arquivo .json exportado daqui. Substitui todas as semanas (Ctrl+Z desfaz).</p><input type="file" id="xf" accept=".json,application/json" class="in" style="padding-top:9px;width:100%"><div class="dact"><button class="btn" data-a="close">Fechar</button></div>`,r=>{
  const stamp=new Date().toISOString().slice(0,10);
  $('#xc',r).onclick=()=>copy(txt);
  $('#xcsv',r).onclick=()=>download(`presenca-${stamp}.csv`,toCSV(w));
  $('#xjson',r).onclick=()=>download(`presenca-backup-${stamp}.json`,JSON.stringify(S,null,1));
  $('#xcj',r).onclick=()=>copy(JSON.stringify(S));
  $('#xf',r).onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=clean(JSON.parse(await f.text()));commit(()=>{S=o;ui.wk=o.cur});closeDlg();toast('Backup restaurado')}catch(err){toast('Esse arquivo não parece um backup válido')}};
 });
}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,row=b.closest('.row'),w=W(),p=row&&w.players.find(x=>x.id===row.dataset.id),d=+b.dataset.d,i=+b.dataset.i;
 const refocus=sel=>{if(e.detail===0){const el=document.querySelector(sel);el&&el.focus()}};
 const rs=row?`.row[data-id="${CSS.escape(row.dataset.id)}"] [data-a="${a}"][data-d="${d}"]`:'';
 switch(a){
  case'pip':if(!p)return;commit(()=>{p.a[d]=p.a[d]===i+1?i:i+1});refocus(rs+`[data-i="${i}"]`);break;
  case'dayall':if(!p)return;commit(()=>{p.a[d]=(p.a[d]||0)<w.days[d].m?w.days[d].m:0});refocus(rs);break;
  case'lowp':if(!p)return;commit(()=>{p.l[d]=Math.min(99,(p.l[d]||0)+1)});refocus(rs);break;
  case'lowm':if(!p||!p.l[d])return;commit(()=>{p.l[d]--});refocus(rs);break;
  case'edit':if(p)playerDlg(p);break;
  case'add':playerDlg(null,ui.cls);break;
  case'addin':playerDlg(null,b.dataset.cls);break;
  case'undo':undo();break;
  case'save':save();break;
  case'import':importDlg();break;
  case'export':exportDlg();break;
  case'week':weekDlg();break;
  case'newweek':newWeekDlg();break;
  case'close':closeDlg();break;
  case'flt':ui.flt=b.dataset.v;render();break;
  case'clear':ui.q='';ui.cls='';ui.flt='all';$('#q').value='';render();break;
  case'find':ui.q=b.dataset.v;$('#q').value=ui.q;ui.cls='';ui.flt='all';render();$('#list').scrollIntoView({behavior:'smooth',block:'start'});break;
 }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.matches('.nm')){const row=t.closest('.row'),p=W().players.find(x=>x.id===row.dataset.id),v=t.value.trim();if(p&&v&&v!==p.name)commit(()=>{p.name=v.slice(0,40)});else if(p)t.value=p.name}
 else if(t.id==='gname'){const v=t.value.trim()||'Presença de Raid';if(v!==S.title)commit(()=>{S.title=v})}
 else if(t.id==='wk'){ui.wk=t.value;render()}
 else if(t.id==='fc'){ui.cls=t.value;render()}
 else if(t.id==='so'){ui.sort=t.value;render()}
});
$('#q').addEventListener('input',e=>{ui.q=e.target.value;renderList()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('#ov').hidden){closeDlg();return}
 if(e.key==='Enter'&&e.target.matches('.nm,.gname')){e.target.blur();return}
 if(!(e.ctrlKey||e.metaKey))return;
 const k=e.key.toLowerCase(),typing=e.target.matches('input,textarea');
 if(k==='s'){e.preventDefault();save()}
 else if(k==='z'&&!typing&&$('#ov').hidden){e.preventDefault();e.shiftKey?redo():undo()}
 else if(k==='y'&&!typing&&$('#ov').hidden){e.preventDefault();redo()}
});

render();
const C=window.claude;
if(C&&typeof C.use==='function'){
 C.use('artifact').then(x=>{ART=x;local=!x;renderStatus()}).catch(()=>{local=true;renderStatus()});
 C.use('downloads').then(x=>{DL=x}).catch(()=>{});
}else{local=true;renderStatus()}
}
</script></body></html>
